name: Build & Deploy to Pages

on:
  push:
    branches:
      - feature/desu-skill-fusion-tree
  workflow_dispatch:

# Required for peaceiris/actions-gh-pages to push to the pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feature/desu-skill-fusion-tree

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # npm run build already passes --aot --base-href /megaten-fusion-tool/
        run: npm run build

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/megaten-fusion-tool
          publish_branch: pages
          force_orphan: false
          commit_message: 'deploy: ${{ github.sha }}'
